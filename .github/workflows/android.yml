
name: BuildMaster AI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Project
        id: prepare
        shell: bash
        run: |
          set -e
          if [ ! -f "BuildMaster_AI_Source_Package.zip" ]; then
            echo "Source ZIP file not found!"
            exit 1
          fi

          mkdir -p source
          unzip -q BuildMaster_AI_Source_Package.zip -d source

          PUBSPEC=$(find source -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "Flutter project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          flutter pub get

      - name: Build APK
        run: flutter build apk --release
        working-directory: ${{ steps.prepare.outputs.project_dir }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BuildMaster-AI-APK
          path: ${{ steps.prepare.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
